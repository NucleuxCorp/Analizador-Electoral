<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña — Validador de Votos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: linear-gradient(180deg, #16213e, #111827);
      border: 1px solid #2a3a5a;
      border-radius: 12px;
      padding: 36px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px #00000066;
    }

    h1 {
      font-size: 1.3rem;
      color: #7ec8e3;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.72rem;
      color: #445;
      text-align: center;
      margin-bottom: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.72rem;
      color: #556;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="password"] {
      font-family: monospace;
      font-size: 1rem;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #2a3a5a;
      background: #0d1520;
      color: #eee;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      border-color: #7ec8e3;
    }

    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      font-family: monospace;
      font-size: 1rem;
      font-weight: bold;
      color: #eee;
      background: linear-gradient(180deg, #1a3a5a, #0f2840);
      border: 1px solid #2a5a8a;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-submit:hover {
      background: linear-gradient(180deg, #1e4a72, #163456);
      border-color: #7ec8e3;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      background: #2a0a0a;
      border: 1px solid #5a1010;
      border-radius: 6px;
      color: #ef5350;
      font-size: 0.8rem;
      padding: 8px 12px;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.visible { display: block; }

    .hint {
      font-size: 0.65rem;
      color: #334;
      margin-top: 3px;
    }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.72rem;
      color: #445;
    }

    .footer-link a {
      color: #7ec8e3;
      text-decoration: none;
    }

    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PFNL422"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="card">
    <h1>Nueva contraseña</h1>
    <div class="subtitle">Ingresá tu nueva contraseña.</div>

    <div id="error-msg" class="error-msg"></div>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
        <span class="hint">Mínimo 8 caracteres.</span>
      </div>

      <div class="field">
        <label for="confirm">Confirmar contraseña</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="8">
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Guardar contraseña</button>
    </form>

    <div class="footer-link">
      <a href="/auth/login">Volver a iniciar sesión</a>
    </div>
  </div>

  <script>
  (function () {
    var form      = document.getElementById("reset-form");
    var errEl     = document.getElementById("error-msg");
    var submitBtn = document.getElementById("submit-btn");
    var accessToken  = null;
    var refreshToken = null;

    // Supabase implicit flow sends result in the URL fragment (#access_token=... or #error=...).
    // The fragment never reaches the server, so we parse it here.
    function parseHash() {
      var hash = window.location.hash.replace(/^#/, "");
      if (!hash) return;
      var params = {};
      hash.split("&").forEach(function (pair) {
        var idx = pair.indexOf("=");
        if (idx === -1) return;
        params[pair.slice(0, idx)] = decodeURIComponent(pair.slice(idx + 1).replace(/\+/g, " "));
      });

      if (params.error || params.error_code) {
        var msg = params.error_description || params.error || "Link inválido o expirado.";
        if (params.error_code === "otp_expired") {
          msg = "El link expiró. Solicitá uno nuevo desde ¿Olvidaste tu contraseña?";
        }
        errEl.textContent = msg;
        errEl.classList.add("visible");
        form.style.display = "none";
        return;
      }

      if (params.access_token) {
        accessToken  = params.access_token;
        refreshToken = params.refresh_token || "";
        // Clean the fragment so the token isn't visible in the address bar.
        history.replaceState(null, "", window.location.pathname);
        return;
      }

      // No fragment at all — could be a server-side rendered error (token_hash flow).
      var serverError = "{{ error|default('') }}";
      if (serverError) {
        errEl.textContent = serverError;
        errEl.classList.add("visible");
        form.style.display = "none";
      } else {
        errEl.textContent = "Link inválido o faltante.";
        errEl.classList.add("visible");
        form.style.display = "none";
      }
    }

    parseHash();

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      errEl.classList.remove("visible");

      var password = document.getElementById("password").value;
      var confirm  = document.getElementById("confirm").value;

      if (password.length < 8) {
        errEl.textContent = "La contraseña debe tener al menos 8 caracteres.";
        errEl.classList.add("visible");
        return;
      }

      if (password !== confirm) {
        errEl.textContent = "Las contraseñas no coinciden.";
        errEl.classList.add("visible");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Guardando…";

      fetch("/auth/recovery", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          password: password,
          access_token: accessToken,
          refresh_token: refreshToken,
        }),
      })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
        .then(function (res) {
          if (res.status === 200) {
            window.location.href = "/auth/login?reset=1";
          } else {
            errEl.textContent = res.data.error || "No se pudo actualizar la contraseña — intentá de nuevo.";
            errEl.classList.add("visible");
            submitBtn.disabled = false;
            submitBtn.textContent = "Guardar contraseña";
          }
        })
        .catch(function () {
          errEl.textContent = "Error de red — intentá de nuevo.";
          errEl.classList.add("visible");
          submitBtn.disabled = false;
          submitBtn.textContent = "Guardar contraseña";
        });
    });
  })();
  </script>
</body>
</html>
