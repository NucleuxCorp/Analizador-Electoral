<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script>
  (function () {
    var token = document.querySelector('meta[name="csrf-token"]').content;
    var origFetch = window.fetch;
    window.fetch = function (input, init) {
      init = init || {};
      var method = (init.method || "GET").toUpperCase();
      if (["POST", "PUT", "PATCH", "DELETE"].indexOf(method) !== -1) {
        init.headers = Object.assign({}, init.headers, { "X-CSRFToken": token });
      }
      return origFetch.call(this, input, init);
    };
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisión transversal — {{ dataset_label }}</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column}

    .topbar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#1e293b;border-bottom:1px solid #334155;flex-shrink:0;min-height:52px;flex-wrap:wrap}
    .topbar h1{font-size:0.88rem;font-weight:700;color:#f8fafc;white-space:nowrap}
    .topbar a{color:#93c5fd;text-decoration:none;font-size:0.78rem}
    .topbar a:hover{text-decoration:underline}
    .topbar select,.topbar input{background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:6px;padding:5px 8px;font-size:0.8rem}
    .topbar input{width:180px}
    .topbar .legend{font-size:0.68rem;color:#64748b;max-width:280px;line-height:1.3}
    .stats-bar{display:flex;gap:14px;font-size:0.72rem;color:#94a3b8;align-items:center}
    .stats-bar strong{color:#f8fafc}
    .btn-export{background:#16a34a;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:0.75rem;cursor:pointer}
    .btn-export:hover{background:#15803d}
    .btn-sidebar-toggle{display:none;background:#334155;color:#e2e8f0;border:none;border-radius:6px;padding:5px 10px;font-size:0.8rem;cursor:pointer}
    .layout{display:flex;flex:1;overflow:hidden;position:relative}
    .sidebar{width:375px;flex-shrink:0;background:#1e293b;border-right:1px solid #334155;overflow-y:auto;display:flex;flex-direction:column}
    .sidebar-filter{display:flex;gap:4px;padding:8px 10px 6px;flex-shrink:0;border-bottom:1px solid #334155}
    .sidebar-filter button{flex:1;background:#0f172a;color:#94a3b8;border:1px solid #334155;border-radius:6px;padding:5px 4px;font-size:0.68rem;cursor:pointer;transition:background .1s,color .1s}
    .sidebar-filter button:hover{border-color:#475569;color:#e2e8f0}
    .sidebar-filter button.active{background:#334155;color:#f8fafc;border-color:#475569}
    .sidebar-filter .sf-count{display:block;font-size:0.62rem;color:#64748b;margin-top:1px}
    .sidebar-filter button.active .sf-count{color:#94a3b8}
    #sidebar-list{flex:1;overflow-y:auto;padding:4px 0}
    .nav-item{display:flex;align-items:flex-start;gap:8px;padding:8px 14px;cursor:pointer;text-decoration:none;color:#cbd5e1;border-left:3px solid transparent}
    .nav-item:hover{background:#0f172a;color:#f8fafc}
    .nav-item.active{background:#0f172a;border-left-color:#fbbf24;color:#fbbf24}
    .nav-item.nav-hidden{display:none}
    .nav-num{font-size:0.68rem;color:#475569;font-family:monospace;min-width:24px;padding-top:2px}
    .nav-label{font-size:0.8rem;line-height:1.4;flex:1}
    .nav-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
    .nav-status.pending{background:#ef4444}
    .nav-status.done{background:#16a34a}
    .sidebar-loading,.empty-msg,.loading{font-size:0.78rem;color:#64748b;padding:12px 14px}

    .main{flex:1;overflow-y:auto;padding:0}
    .mesa-header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;gap:8px;flex-wrap:wrap;background:#0f172a;border-bottom:1px solid #1e293b;min-height:40px}
    .mesa-title{display:flex;align-items:center;gap:8px;font-family:monospace;font-size:0.8rem;color:#94a3b8;flex-wrap:wrap}
    .mesa-meta{font-size:0.68rem;color:#475569}
    .dept-badge{background:#fbbf24;color:#0f172a;font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase}
    .mesa-nav{display:flex;align-items:center;gap:8px}
    .mesa-nav button{background:#334155;color:#e2e8f0;border:none;border-radius:6px;padding:3px 10px;font-size:0.75rem;cursor:pointer}
    .mesa-nav button:hover{background:#475569}

    .page-row{padding:6px 12px 12px}
    .page-badge{font-size:0.65rem;color:#475569;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .page-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:start}
    .cell{border-radius:6px;border:1px solid #334155;overflow:visible}
    .src-label{position:sticky;top:40px;z-index:5;font-size:0.68rem;font-weight:700;color:#fff;padding:3px 8px;text-transform:uppercase;letter-spacing:.05em}
    .cell img{width:100%;height:auto;display:block;border-radius:0 0 6px 6px}
    .cell.missing{background:#0f172a}
    .no-pdf{display:flex;align-items:center;justify-content:center;min-height:120px;font-size:0.8rem;color:#334155;font-style:italic}

    .mesa-header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;gap:8px;flex-wrap:wrap;background:#0f172a;border-bottom:1px solid #1e293b;min-height:40px}
    .source-cols{padding:6px 12px 12px}
    .src-col{display:flex;flex-direction:column;gap:6px;min-width:0}
    .src-col-sticky{position:sticky;top:40px;z-index:5;background:#0f172a;padding-bottom:4px}
    .col-alerts{display:flex;flex-direction:column;gap:4px;padding:6px;max-height:40vh;overflow-y:auto;background:#1e293b;border:1px solid #334155;border-radius:8px}
    .col-alert-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:0.7rem}
    .col-alert-field{font-weight:600;color:#e2e8f0}
    .alerts-global{padding:8px 12px;display:flex;flex-direction:column;gap:8px}
    .alerts-auto,.alerts-field-meta{display:flex;flex-direction:column;gap:6px}
    .alert-badge{background:#ef4444;color:#fff;font-size:0.65rem;font-weight:700;padding:2px 7px;border-radius:999px}
    .alert-item{border-radius:8px;overflow:hidden;border:1px solid #334155}
    .alert-item.alert-auto{opacity:0.85;border-color:#1e3a2f}
    .alert-item-header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#16a34a18}
    .alert-item-header.human{background:#fbbf2422;border-bottom:1px solid #fbbf2444}
    .alert-src-name{font-size:0.72rem;font-weight:700;color:#86efac}
    .alert-item-header.human .alert-src-name{color:#fbbf24}
    .alert-auto-badge{margin-left:auto;font-size:0.65rem;color:#4ade80}
    .alert-class{margin-left:auto;font-size:0.65rem;color:#94a3b8}
    .alert-msg{font-size:0.72rem;color:#94a3b8;padding:4px 10px 6px;line-height:1.4}
    .alert-section-label{font-size:0.68rem;color:#64748b;margin-bottom:4px;font-weight:600}
    .alert-section-label.human{color:#fbbf24;margin-top:4px}
    .alert-actions{display:flex;align-items:center;gap:6px;padding:4px 10px 8px}
    .alert-src-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .src-name{font-size:0.68rem;color:#94a3b8;margin-right:auto}
    .btn-accept,.btn-reject{border:none;border-radius:6px;padding:3px 10px;font-size:0.72rem;font-weight:600;cursor:pointer;color:#fff}
    .btn-accept{background:#16a34a}
    .btn-accept:hover{background:#15803d}
    .btn-reject{background:#dc2626}
    .btn-reject:hover{background:#b91c1c}
    .btn-accept:disabled,.btn-reject:disabled{opacity:0.35;cursor:not-allowed}
    .btn-accept.is-current{outline:2px solid #86efac;outline-offset:1px}
    .btn-reject.is-current{outline:2px solid #fca5a5;outline-offset:1px}
    .src-missing{font-size:0.62rem;color:#f59e0b;font-weight:600}
    .decided-row,.decided-inline{font-size:0.72rem;color:#94a3b8;padding:2px 10px}
    .btn-reopen{margin:8px 10px 4px;border:1px solid #475569;background:#334155;color:#e2e8f0;border-radius:8px;padding:6px 12px;font-size:0.72rem;font-weight:600;cursor:pointer;width:calc(100% - 20px)}
    .btn-reopen:hover{background:#475569}
    .edit-locked{font-size:0.68rem;color:#64748b;padding:6px 10px 8px;line-height:1.4}

    .btn-report{background:#1e3a5f;color:#7ec8e3;border:1px solid #2563eb;border-radius:6px;padding:3px 10px;font-size:0.75rem;cursor:pointer;white-space:nowrap}
    .btn-report:hover{background:#1e40af}
    .modal-overlay{display:none;position:fixed;inset:0;background:#0009;z-index:200;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:#1e293b;border:1px solid #334155;border-radius:12px;width:340px;max-width:95vw;box-shadow:0 16px 48px #0008;overflow:hidden}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0f172a;border-bottom:1px solid #334155}
    .modal-header h3{font-size:0.85rem;font-weight:700;color:#f8fafc;margin:0}
    .modal-close{background:none;border:none;color:#64748b;font-size:1rem;cursor:pointer;padding:0;line-height:1}
    .modal-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow-y:auto}
    .modal-section-label{font-size:0.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
    .report-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .rtype-btn{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 6px;color:#94a3b8;font-size:0.68rem;cursor:pointer;text-align:left}
    .rtype-btn.selected{border-color:#3b82f6;background:#1e3a5f;color:#7ec8e3}
    .modal-notes{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:0.8rem;padding:8px 10px;resize:vertical;min-height:70px;font-family:inherit}
    .modal-footer{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #1e293b}
    .btn-modal-save{flex:1;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:8px;font-size:0.8rem;font-weight:600;cursor:pointer}
    .btn-modal-cancel{background:#334155;color:#94a3b8;border:none;border-radius:8px;padding:8px 14px;font-size:0.8rem;cursor:pointer}
    .modal-saved-list{display:flex;flex-direction:column;gap:4px}
    .modal-saved-item{display:flex;align-items:flex-start;gap:6px;padding:6px;background:#0f172a;border-radius:6px;font-size:0.72rem;color:#94a3b8}
    .rtype-badge{font-size:0.65rem;padding:2px 6px;border-radius:4px;font-weight:700}
    .rtype-badge.enmienda{background:#3b1f1f;color:#f87171}
    .rtype-badge.campos_vacios{background:#1e3a2f;color:#4ade80}
    .rtype-badge.otro{background:#1e293b;color:#94a3b8;border:1px solid #334155}
    .modal-del-btn{margin-left:auto;background:none;border:none;color:#475569;cursor:pointer}
    .req{color:#ef4444}
    .source-checks{display:flex;flex-direction:column;gap:6px}
    .src-check-label{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#0f172a;border:1px solid #334155;border-radius:8px;cursor:pointer;font-size:0.8rem;color:#cbd5e1}
    .src-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .field-tag{font-size:0.65rem;padding:2px 7px;border-radius:4px;font-weight:600}
    .field-tag.on{background:#1e3a2f;color:#4ade80;border:1px solid #166534}
    .field-tag.off{background:#1e1e1e;color:#475569;border:1px solid #334155;text-decoration:line-through}
    .campos-src-block{border:1px solid #334155;border-radius:8px;margin-bottom:6px;overflow:hidden}
    .campos-src-header{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:0.75rem;font-weight:700}
    .campos-src-fields{display:flex;flex-direction:column;gap:4px;padding:8px 10px}
    .campos-src-fields label{display:flex;align-items:center;gap:7px;font-size:0.75rem;color:#cbd5e1}

    @media(max-width:768px){
      .sidebar{display:none}
      .sidebar.open{display:flex;flex-direction:column;position:fixed;top:52px;left:0;bottom:0;z-index:100;width:85vw;max-width:320px;box-shadow:4px 0 24px #000a}
      .btn-sidebar-toggle{display:inline-block}
      .topbar .legend{display:none}
      .topbar input{width:110px}
      .page-cols,.source-cols{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<div class="topbar">
  <button type="button" class="btn-sidebar-toggle" onclick="toggleSidebar()">☰ Mesas</button>
  <a href="/admin/conflicts">← Admin</a>
  <h1>Revisión transversal — {{ dataset_label }}</h1>
  <select id="dept-filter" onchange="onFilterChange()">
    <option value="">Todos los depts.</option>
    <option value="01">ANTIOQUIA</option><option value="03">ATLANTICO</option>
    <option value="05">BOLIVAR</option><option value="07">BOYACA</option>
    <option value="09">CALDAS</option><option value="11">CAUCA</option>
    <option value="12">CESAR</option><option value="13">CORDOBA</option>
    <option value="15">CUNDINAMARCA</option><option value="16">BOGOTA D.C</option>
    <option value="17">CHOCO</option><option value="19">HUILA</option>
    <option value="21">MAGDALENA</option><option value="23">NARIÑO</option>
    <option value="24">RISARALDA</option><option value="25">NORTE DE SAN</option>
    <option value="26">QUINDIO</option><option value="27">SANTANDER</option>
    <option value="28">SUCRE</option><option value="29">TOLIMA</option>
    <option value="31">VALLE</option><option value="40">ARAUCA</option>
    <option value="44">CAQUETA</option><option value="46">CASANARE</option>
    <option value="48">LA GUAJIRA</option><option value="50">GUAINIA</option>
    <option value="52">META</option><option value="54">GUAVIARE</option>
    <option value="56">SAN ANDRES</option><option value="60">AMAZONAS</option>
    <option value="64">PUTUMAYO</option><option value="68">VAUPES</option>
    <option value="72">VICHADA</option><option value="88">CONSULADOS</option>
  </select>
  <input id="search" placeholder="Buscar mesa…" oninput="onSearchInput()">
  <div class="stats-bar">
    <span><strong id="stat-total">—</strong> mesas</span>
    <span><strong id="stat-pending">—</strong> pendientes</span>
    <span><strong id="stat-done">—</strong> revisadas</span>
  </div>
  <span class="legend">Cola {{ dataset_key }} — compare visual E14C / E14D / E14T</span>
  <button type="button" class="btn-export" onclick="exportDecisions()">Exportar JSON</button>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-filter">
      <button type="button" id="sf-all" class="active" onclick="setSidebarFilter('all')">Todas<span class="sf-count" id="sf-all-n">—</span></button>
      <button type="button" id="sf-pending" onclick="setSidebarFilter('pending')">Pendientes<span class="sf-count" id="sf-pending-n">—</span></button>
      <button type="button" id="sf-done" onclick="setSidebarFilter('done')">Revisadas<span class="sf-count" id="sf-done-n">—</span></button>
    </div>
    <div id="sidebar-list"><p class="sidebar-loading">Cargando cola…</p></div>
  </nav>
  <main class="main" id="main">
    <p class="loading">Iniciando…</p>
  </main>
</div>

<div class="modal-overlay" id="report-modal" onclick="closeReportModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>📝 Reporte de mesa</h3>
      <button type="button" class="modal-close" onclick="closeReportModal()">✕</button>
    </div>
    <div class="modal-body">
      <div>
        <div class="modal-section-label">1. Fuentes <span class="req">*</span></div>
        <div class="source-checks">
          <label class="src-check-label"><input type="checkbox" class="src-check" value="e14t" onchange="onReportSrcChange()"><span class="src-dot" style="background:#2563eb"></span>E14T — Testigo</label>
          <label class="src-check-label"><input type="checkbox" class="src-check" value="e14d" onchange="onReportSrcChange()"><span class="src-dot" style="background:#dc2626"></span>E14D — Delegado</label>
          <label class="src-check-label"><input type="checkbox" class="src-check" value="e14c" onchange="onReportSrcChange()"><span class="src-dot" style="background:#16a34a"></span>E14C — Oficial</label>
        </div>
      </div>
      <div>
        <div class="modal-section-label">2. Tipo de reporte <span class="req">*</span></div>
        <div class="report-type-grid">
          <button type="button" class="rtype-btn" data-type="campos_vacios" onclick="selectReportType(this)">📋 Campos vacíos</button>
          <button type="button" class="rtype-btn" data-type="enmienda" onclick="selectReportType(this)">✎ Enmienda</button>
          <button type="button" class="rtype-btn" data-type="otro" onclick="selectReportType(this)">… Otros</button>
        </div>
      </div>
      <div id="campos-detail" style="display:none">
        <div class="modal-section-label">3. Campos por fuente</div>
        <div id="campos-per-src"></div>
      </div>
      <div>
        <div class="modal-section-label">Notas <span class="req">*</span></div>
        <textarea class="modal-notes" id="report-notes" placeholder="Descripción obligatoria del hallazgo..."></textarea>
      </div>
      <div id="modal-saved-section" style="display:none">
        <div class="modal-section-label">Reportes guardados</div>
        <div class="modal-saved-list" id="modal-saved-list"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-modal-cancel" onclick="closeReportModal()">Cancelar</button>
      <button type="button" class="btn-modal-save" onclick="saveModalReport()">Guardar reporte</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='transversal.js') }}"></script>
</body>
</html>
