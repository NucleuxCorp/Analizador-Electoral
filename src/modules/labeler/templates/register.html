<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-PFNL422');</script>
  <!-- End Google Tag Manager -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — Verificación E-14</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: linear-gradient(180deg, #16213e, #111827);
      border: 1px solid #2a3a5a;
      border-radius: 12px;
      padding: 36px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px #00000066;
    }

    h1 {
      font-size: 1.3rem;
      color: #7ec8e3;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.72rem;
      color: #445;
      text-align: center;
      margin-bottom: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.72rem;
      color: #556;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      font-family: monospace;
      font-size: 1rem;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #2a3a5a;
      background: #0d1520;
      color: #eee;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #7ec8e3; }

    .row { display: flex; gap: 10px; }
    .row .field { flex: 1; }

    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      font-family: monospace;
      font-size: 1rem;
      font-weight: bold;
      color: #eee;
      background: linear-gradient(180deg, #1a3a5a, #0f2840);
      border: 1px solid #2a5a8a;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-submit:hover {
      background: linear-gradient(180deg, #1e4a72, #163456);
      border-color: #7ec8e3;
    }

    .btn-submit:active { transform: scale(0.98); }

    .error-msg {
      background: #2a0a0a;
      border: 1px solid #5a1010;
      border-radius: 6px;
      color: #ef5350;
      font-size: 0.8rem;
      padding: 8px 12px;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.visible { display: block; }

    .success-msg {
      background: #0a2a0a;
      border: 1px solid #1a5a1a;
      border-radius: 6px;
      color: #66bb6a;
      font-size: 0.8rem;
      padding: 10px 12px;
      margin-bottom: 16px;
      display: none;
    }

    .success-msg.visible { display: block; }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.72rem;
      color: #445;
    }

    .footer-link a { color: #7ec8e3; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }

    .hint { font-size: 0.65rem; color: #334; margin-top: 3px; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PFNL422"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="card">
    <h1>Crear cuenta</h1>
    <div class="subtitle">Verificación Ciudadana de Actas E-14</div>

    <div id="error-msg" class="error-msg"></div>
    <div id="success-msg" class="success-msg"></div>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="first_name">Nombre</label>
        <input type="text" id="first_name" name="first_name" autocomplete="given-name" autofocus required>
      </div>

      <div class="field">
        <label for="phone">Teléfono <span style="text-transform:none; color:#445;">(opcional)</span></label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="+57 300 000 0000">
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
        <span class="hint">Mínimo 8 caracteres.</span>
      </div>

      <!-- reCAPTCHA Enterprise -->
      <div style="font-size:0.62rem;color:#445;margin-bottom:12px;line-height:1.4;">
        Este sitio está protegido por reCAPTCHA Enterprise y se aplican la
        <a href="https://policies.google.com/privacy" target="_blank" rel="noopener" style="color:#7ec8e3;">Política de Privacidad</a> y los
        <a href="https://policies.google.com/terms" target="_blank" rel="noopener" style="color:#7ec8e3;">Términos del Servicio</a> de Google.
      </div>

      <div class="field" style="flex-direction:row;align-items:flex-start;gap:8px;">
        <input type="checkbox" id="accept-privacy" style="margin-top:2px;width:auto;" required>
        <label for="accept-privacy" style="font-size:0.72rem;color:#99a;text-transform:none;letter-spacing:0;">
          Acepto la
          <a href="/privacy" target="_blank" style="color:#7ec8e3;">Política de Privacidad</a>
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Crear cuenta</button>
    </form>

    <div class="footer-link">
      ¿Ya tenés cuenta? <a href="/auth/login">Iniciar sesión</a>
    </div>
  </div>

  <script src="https://www.google.com/recaptcha/enterprise.js?render={{ RECAPTCHA_SITE_KEY }}" async defer></script>
  <script>
  (function () {
    var form      = document.getElementById("register-form");
    var errEl     = document.getElementById("error-msg");
    var successEl = document.getElementById("success-msg");
    var submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      errEl.classList.remove("visible");
      successEl.classList.remove("visible");

      var firstName = document.getElementById("first_name").value.trim();
      var phone     = document.getElementById("phone").value.trim();
      var email     = document.getElementById("email").value.trim();
      var password  = document.getElementById("password").value;

      if (!firstName || !email || !password) {
        errEl.textContent = "Completá nombre, correo y contraseña.";
        errEl.classList.add("visible");
        return;
      }

      if (password.length < 8) {
        errEl.textContent = "La contraseña debe tener al menos 8 caracteres.";
        errEl.classList.add("visible");
        return;
      }

      var privacyAccepted = document.getElementById("accept-privacy");
      if (!privacyAccepted || !privacyAccepted.checked) {
        errEl.textContent = "Debés aceptar la Política de Privacidad para registrarte.";
        errEl.classList.add("visible");
        return;
      }

      if (typeof grecaptcha === "undefined" || !grecaptcha.enterprise) {
        errEl.textContent = "Error de seguridad. Recargá la página e intentá de nuevo.";
        errEl.classList.add("visible");
        return;
      }
      var siteKey = {{ RECAPTCHA_SITE_KEY | tojson }};
      grecaptcha.enterprise.execute(siteKey, {action: "register"}).then(function(token) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Creando cuenta…";
        fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            first_name: firstName,
            phone: phone,
            email: email,
            password: password,
            g_recaptcha_response: token,
          }),
        })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
        .then(function (res) {
          if (res.status === 201) {
            form.style.display = "none";
            successEl.textContent =
              "¡Cuenta creada! Revisá tu correo, confirmá la cuenta y luego iniciá sesión.";
            successEl.classList.add("visible");
          } else if (res.status === 409) {
            errEl.textContent = "Ese correo ya está registrado. Probá iniciar sesión.";
            errEl.classList.add("visible");
            submitBtn.disabled = false;
            submitBtn.textContent = "Crear cuenta";
          } else {
            errEl.textContent = res.data.error || "No se pudo crear la cuenta — intentá de nuevo.";
            errEl.classList.add("visible");
            submitBtn.disabled = false;
            submitBtn.textContent = "Crear cuenta";
          }
        })
        .catch(function () {
          errEl.textContent = "Error de red — intentá de nuevo.";
          errEl.classList.add("visible");
          submitBtn.disabled = false;
          submitBtn.textContent = "Crear cuenta";
        });
      });
    });
  })();
  </script>
</body>
</html>
