<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta â€” VerificaciÃ³n E-14</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: linear-gradient(180deg, #16213e, #111827);
      border: 1px solid #2a3a5a;
      border-radius: 12px;
      padding: 36px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px #00000066;
    }

    h1 {
      font-size: 1.3rem;
      color: #7ec8e3;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.72rem;
      color: #445;
      text-align: center;
      margin-bottom: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.72rem;
      color: #556;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      font-family: monospace;
      font-size: 1rem;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #2a3a5a;
      background: #0d1520;
      color: #eee;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #7ec8e3; }

    .row { display: flex; gap: 10px; }
    .row .field { flex: 1; }

    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      font-family: monospace;
      font-size: 1rem;
      font-weight: bold;
      color: #eee;
      background: linear-gradient(180deg, #1a3a5a, #0f2840);
      border: 1px solid #2a5a8a;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-submit:hover {
      background: linear-gradient(180deg, #1e4a72, #163456);
      border-color: #7ec8e3;
    }

    .btn-submit:active { transform: scale(0.98); }

    .error-msg {
      background: #2a0a0a;
      border: 1px solid #5a1010;
      border-radius: 6px;
      color: #ef5350;
      font-size: 0.8rem;
      padding: 8px 12px;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.visible { display: block; }

    .success-msg {
      background: #0a2a0a;
      border: 1px solid #1a5a1a;
      border-radius: 6px;
      color: #66bb6a;
      font-size: 0.8rem;
      padding: 10px 12px;
      margin-bottom: 16px;
      display: none;
    }

    .success-msg.visible { display: block; }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.72rem;
      color: #445;
    }

    .footer-link a { color: #7ec8e3; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }

    .hint { font-size: 0.65rem; color: #334; margin-top: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Crear cuenta</h1>
    <div class="subtitle">VerificaciÃ³n Ciudadana de Actas E-14</div>

    <div id="error-msg" class="error-msg"></div>
    <div id="success-msg" class="success-msg"></div>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="first_name">Nombre</label>
        <input type="text" id="first_name" name="first_name" autocomplete="given-name" autofocus required>
      </div>

      <div class="field">
        <label for="phone">TelÃ©fono <span style="text-transform:none; color:#445;">(opcional)</span></label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="+57 300 000 0000">
      </div>

      <div class="field">
        <label for="email">Correo electrÃ³nico</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">ContraseÃ±a</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
        <span class="hint">MÃ­nimo 8 caracteres.</span>
      </div>

      <!-- reCAPTCHA -->
      <div class="g-recaptcha" data-sitekey="{{ RECAPTCHA_SITE_KEY }}" style="margin-bottom:12px;"></div>
      <div style="font-size:0.62rem;color:#445;margin-bottom:12px;line-height:1.4;">
        Este sitio estÃ¡ protegido por reCAPTCHA y se aplican la
        <a href="https://policies.google.com/privacy" target="_blank" rel="noopener" style="color:#7ec8e3;">PolÃ­tica de Privacidad</a> y los
        <a href="https://policies.google.com/terms" target="_blank" rel="noopener" style="color:#7ec8e3;">TÃ©rminos del Servicio</a> de Google.
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Crear cuenta</button>
    </form>

    <div class="footer-link">
      Â¿Ya tenÃ©s cuenta? <a href="/auth/login">Iniciar sesiÃ³n</a>
    </div>
  </div>

  <script src="https://www.google.com/recaptcha/enterprise.js" async defer></script>
  <script>
  (function () {
    var form      = document.getElementById("register-form");
    var errEl     = document.getElementById("error-msg");
    var successEl = document.getElementById("success-msg");
    var submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      errEl.classList.remove("visible");
      successEl.classList.remove("visible");

      var firstName = document.getElementById("first_name").value.trim();
      var phone     = document.getElementById("phone").value.trim();
      var email     = document.getElementById("email").value.trim();
      var password  = document.getElementById("password").value;

      if (!firstName || !email || !password) {
        errEl.textContent = "CompletÃ¡ nombre, correo y contraseÃ±a.";
        errEl.classList.add("visible");
        return;
      }

      if (password.length < 8) {
        errEl.textContent = "La contraseÃ±a debe tener al menos 8 caracteres.";
        errEl.classList.add("visible");
        return;
      }

      // reCAPTCHA check
      var recaptchaToken = grecaptcha ? grecaptcha.enterprise.getResponse() : "";
      if (!recaptchaToken) {
        errEl.textContent = "CompletÃ¡ la verificaciÃ³n de seguridad (No soy un robot).";
        errEl.classList.add("visible");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creando cuentaâ€¦";

      fetch("/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          first_name: firstName,
          phone: phone,
          email: email,
          password: password,
          g_recaptcha_response: recaptchaToken,
        }),
      })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
        .then(function (res) {
          if (res.status === 201) {
            form.style.display = "none";
            successEl.textContent =
              "Â¡Cuenta creada! RevisÃ¡ tu correo, confirmÃ¡ la cuenta y luego iniciÃ¡ sesiÃ³n.";
            successEl.classList.add("visible");
          } else if (res.status === 409) {
            errEl.textContent = "Ese correo ya estÃ¡ registrado. ProbÃ¡ iniciar sesiÃ³n.";
            errEl.classList.add("visible");
            submitBtn.disabled = false;
            submitBtn.textContent = "Crear cuenta";
          } else {
            errEl.textContent = res.data.error || "No se pudo crear la cuenta â€” intentÃ¡ de nuevo.";
            errEl.classList.add("visible");
            submitBtn.disabled = false;
            submitBtn.textContent = "Crear cuenta";
          }
        })
        .catch(function () {
          errEl.textContent = "Error de red â€” intentÃ¡ de nuevo.";
          errEl.classList.add("visible");
          submitBtn.disabled = false;
          submitBtn.textContent = "Crear cuenta";
        });
    });
  })();
  </script>
</body>
</html>
